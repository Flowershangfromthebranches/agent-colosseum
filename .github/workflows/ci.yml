name: ci
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        node: ['22.19', '24']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:coverage
      - run: pnpm --filter agent-colosseum build
      - run: pnpm pack:plugin
      - name: DSH master canary
        continue-on-error: true
        run: |
          git clone --depth 1 https://github.com/deepseek-ai/deepseek-harness.git /tmp/dsh-master
          echo "cloned master $(git -C /tmp/dsh-master rev-parse --short HEAD)" > dsh-canary.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dsh-canary-${{ matrix.node }}
          path: dsh-canary.txt
          if-no-files-found: ignore
